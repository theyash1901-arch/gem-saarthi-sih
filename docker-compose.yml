services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gem_saarthi
      POSTGRES_USER: gem_saarthi
      POSTGRES_PASSWORD: gem_saarthi_dev
    ports:
      - "5432:5432"
    volumes:
      - gem_saarthi_pg:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gem_saarthi:gem_saarthi_dev@db:5432/gem_saarthi
      SECRET_KEY: change-me
    depends_on:
      - db
    ports:
      - "8000:8000"
volumes:
  gem_saarthi_pg:
